name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Test health endpoint and absence of business routes
        run: python -m unittest discover -s tests -v
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build and wait for healthy container
        run: docker compose up --build --detach --wait --wait-timeout 120
      - name: Check published HTTP endpoint
        run: python services/orders/healthcheck.py
      - name: Container diagnostics
        if: always()
        run: docker compose ps --all
      - name: Container logs
        if: always()
        run: docker compose logs --no-color
      - name: Stop containers
        if: always()
        run: docker compose down
